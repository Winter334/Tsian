<svg width="240" height="240" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 核心能量渐变 -->
    <linearGradient id="riftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;" />
      <stop offset="100%" style="stop-color:#EC4899;" />
    </linearGradient>
    
    <!-- 辉光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 强化的背景几何结构 (Order Matrix) -->
  <!-- 外部主支撑框：深色 Indigo -->
  <rect x="50" y="50" width="100" height="100" fill="none" stroke="#4338CA" stroke-width="2" opacity="0.6" transform="rotate(45 100 100)"/>
  
  <!-- 内部平衡框：亮色 Magenta -->
  <rect x="52" y="52" width="96" height="96" fill="none" stroke="#EC4899" stroke-width="1.2" opacity="0.4" transform="rotate(22.5 100 100)"/>

  <!-- 辅助对角线：强化空间深度 -->
  <g stroke="#6366F1" stroke-width="0.8" opacity="0.3">
    <line x1="100" y1="20" x2="100" y2="180" />
    <line x1="20" y1="100" x2="180" y2="100" />
  </g>

  <!-- 2. 核心十字裂隙 (The Rift) -->
  <!-- 主体形状 -->
  <path d="M100 12 
           L112 88 
           L188 100 
           L112 112 
           L100 188 
           L88 112 
           L12 100 
           L88 88 Z" 
        fill="url(#riftGrad)" 
        filter="url(#glow)"/>

  <!-- 内部二次撕裂线：增加锐利感和深度 -->
  <path d="M100 35 L108 92 L165 100 L108 108 L100 165 L92 108 L35 100 L92 92 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1.2" 
        opacity="0.8"/>
  
  <!-- 3. 中心极小奇点 -->
  <!-- 象征 AI 的核心算法节点或者游戏的起点 -->
  <rect x="96" y="96" width="8" height="8" fill="#FFFFFF" transform="rotate(45 100 100)" />
</svg>